<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Solar Inverter Temperature Analyzer
    </title>


    <!-- CSS -->
    <link rel="stylesheet" href="style.css">



    <!-- Excel Reader / Writer -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>



    <!-- Chart Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- Date Time Support for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>



    <!-- Zoom and Pan -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>


</head>



<body>


<div class="container">


    <h1>
        Solar Inverter Temperature Analyzer
    </h1>


    <p class="subtitle">
        Upload inverter temperature data and generate temperature trend reports.
    </p>




    <!-- Upload -->


    <div class="uploadBox">


        <label>
            Upload Excel Workbook
        </label>


        <br><br>


        <input 
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >


    </div>





    <!-- Selection -->


    <div id="selectionCard" class="hidden">


        <h2>
            Select Temperature Channels
        </h2>


        <p>
            Select inverter temperature values to plot.
        </p>



        <div id="checkboxContainer">


        </div>



        <button id="generateBtn">

            Generate Graph

        </button>



    </div>







    <!-- Processing -->


    <div id="progressCard" class="hidden">


        <h2>
            Processing Workbook
        </h2>



        <div class="progressBar">

            <div id="progressFill"></div>

        </div>



        <p id="progressText">

        </p>



    </div>








    <!-- Graph Preview -->


    <div id="chartContainer" class="hidden">


        <h2>
            Temperature Trend Graph
        </h2>



        <div class="chartBox">


            <canvas id="tempChart"></canvas>


        </div>





        <button id="resetZoomBtn">

            Reset Zoom

        </button>



        <button id="downloadBtn">

            Download Excel Report

        </button>



    </div>








    <div class="footer">

        Solar Temperature Analysis Tool

    </div>



</div>




<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="script.js"></script>


</body>

</html>
